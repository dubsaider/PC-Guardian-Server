{% extends "base.html" %}

{% block title %}События - PC-Guardian{% endblock %}

{% block content %}
<div class="row mb-4">
    <div class="col-12">
        <h1><i class="bi bi-journal-text"></i> Журнал событий</h1>
    </div>
</div>

<!-- Фильтры -->
<div class="row mb-3">
    <div class="col-12">
        <div class="card">
            <div class="card-body">
                <div class="row g-3">
                    <div class="col-md-2">
                        <label class="form-label">Компонент</label>
                        <select class="form-select" id="filter-component">
                            <option value="">Все</option>
                            <option value="motherboard">Материнская плата</option>
                            <option value="cpu">Процессор</option>
                            <option value="ram">RAM</option>
                            <option value="storage">Накопитель</option>
                            <option value="gpu">Видеокарта</option>
                            <option value="network">Сетевой адаптер</option>
                            <option value="psu">Блок питания</option>
                            <option value="peripherals">Периферия</option>
                        </select>
                    </div>
                    <div class="col-md-2">
                        <label class="form-label">Тип события</label>
                        <select class="form-select" id="filter-event-type">
                            <option value="">Все</option>
                            <option value="added">Добавлен</option>
                            <option value="removed">Удален</option>
                            <option value="replaced">Заменен</option>
                        </select>
                    </div>
                    <div class="col-md-2">
                        <label class="form-label">Корпус</label>
                        <input type="text" class="form-control" id="filter-building" placeholder="Корпус">
                    </div>
                    <div class="col-md-2">
                        <label class="form-label">Этаж</label>
                        <input type="text" class="form-control" id="filter-floor" placeholder="Этаж">
                    </div>
                    <div class="col-md-2">
                        <label class="form-label">Локация</label>
                        <input type="text" class="form-control" id="filter-location" placeholder="Локация">
                    </div>
                    <div class="col-md-2">
                        <label class="form-label">Дата от</label>
                        <input type="date" class="form-control" id="filter-date-from">
                    </div>
                </div>
                <div class="row g-3 mt-2">
                    <div class="col-md-2">
                        <label class="form-label">Дата до</label>
                        <input type="date" class="form-control" id="filter-date-to">
                    </div>
                    <div class="col-md-3">
                        <label class="form-label">Поиск (hostname/IP)</label>
                        <input type="text" class="form-control" id="filter-search" placeholder="Поиск...">
                    </div>
                    <div class="col-md-1">
                        <label class="form-label">&nbsp;</label>
                        <button class="btn btn-primary w-100" onclick="applyFilters()">
                            <i class="bi bi-search"></i> Поиск
                        </button>
                    </div>
                    <div class="col-md-1">
                        <label class="form-label">&nbsp;</label>
                        <button class="btn btn-secondary w-100" onclick="resetFilters()">
                            <i class="bi bi-x-circle"></i> Сброс
                        </button>
                    </div>
                </div>
            </div>
        </div>
    </div>
</div>

<!-- Таблица событий -->
<div class="row">
    <div class="col-12">
        <div class="card">
            <div class="card-header d-flex justify-content-between align-items-center">
                <h5 class="mb-0">События</h5>
                <span class="badge bg-secondary" id="total-count">0</span>
            </div>
            <div class="card-body">
                <div class="table-responsive">
                    <table class="table table-hover">
                        <thead>
                            <tr>
                                <th style="cursor: pointer;" onclick="sortTable('timestamp')">
                                    Время <i class="bi bi-arrow-down-up" id="sort-timestamp"></i>
                                </th>
                                <th style="cursor: pointer;" onclick="sortTable('pc_id')">
                                    PC ID <i class="bi bi-arrow-down-up" id="sort-pc_id"></i>
                                </th>
                                <th style="cursor: pointer;" onclick="sortTable('component_type')">
                                    Компонент <i class="bi bi-arrow-down-up" id="sort-component_type"></i>
                                </th>
                                <th style="cursor: pointer;" onclick="sortTable('event_type')">
                                    Тип изменения <i class="bi bi-arrow-down-up" id="sort-event_type"></i>
                                </th>
                                <th>Детали</th>
                            </tr>
                        </thead>
                        <tbody id="events-tbody">
                            <tr>
                                <td colspan="5" class="text-center">Загрузка...</td>
                            </tr>
                        </tbody>
                    </table>
                </div>
                <!-- Пагинация -->
                <nav aria-label="Page navigation">
                    <ul class="pagination justify-content-center" id="pagination">
                    </ul>
                </nav>
            </div>
        </div>
    </div>
</div>
{% endblock %}

{% block scripts %}
<script>
let currentFilters = {
    component_type: '',
    event_type: '',
    building: '',
    floor: '',
    location: '',
    date_from: '',
    date_to: '',
    search: '',
    sort_by: 'timestamp',
    sort_order: 'desc',
    skip: 0,
    limit: 50
};
let currentPage = 1;
let totalPages = 1;

function buildUrl() {
    let url = `/api/events?skip=${currentFilters.skip}&limit=${currentFilters.limit}`;
    if (currentFilters.component_type) url += `&component_type=${currentFilters.component_type}`;
    if (currentFilters.event_type) url += `&event_type=${currentFilters.event_type}`;
    if (currentFilters.building) url += `&building=${encodeURIComponent(currentFilters.building)}`;
    if (currentFilters.floor) url += `&floor=${encodeURIComponent(currentFilters.floor)}`;
    if (currentFilters.location) url += `&location=${encodeURIComponent(currentFilters.location)}`;
    if (currentFilters.date_from) url += `&date_from=${currentFilters.date_from}`;
    if (currentFilters.date_to) url += `&date_to=${currentFilters.date_to}`;
    if (currentFilters.search) url += `&search=${encodeURIComponent(currentFilters.search)}`;
    if (currentFilters.sort_by) url += `&sort_by=${currentFilters.sort_by}`;
    if (currentFilters.sort_order) url += `&sort_order=${currentFilters.sort_order}`;
    return url;
}

function loadEvents() {
    const url = buildUrl();
    
    fetch(url, {
        credentials: 'include'
    })
    .then(r => {
        if (r.status === 401) {
            window.location.href = '/login';
            return;
        }
        return r.json();
    })
    .then(data => {
        if (!data) return;
        const tbody = document.getElementById('events-tbody');
        tbody.innerHTML = '';
        
        document.getElementById('total-count').textContent = data.total;
        
        if (data.items.length === 0) {
            tbody.innerHTML = '<tr><td colspan="5" class="text-center">Нет событий</td></tr>';
            return;
        }
        
        totalPages = Math.ceil(data.total / currentFilters.limit);
        updatePagination();
        
        const componentNames = {
            'motherboard': 'Материнская плата',
            'cpu': 'Процессор',
            'ram': 'RAM',
            'storage': 'Накопитель',
            'gpu': 'Видеокарта',
            'network': 'Сетевой адаптер',
            'psu': 'Блок питания',
            'peripherals': 'Периферия'
        };
        
        const eventTypes = {
            'removed': '<span class="badge bg-danger">Удален</span>',
            'added': '<span class="badge bg-success">Добавлен</span>',
            'replaced': '<span class="badge bg-warning">Заменен</span>'
        };
        
        data.items.forEach(event => {
            const row = document.createElement('tr');
            row.innerHTML = `
                <td>${new Date(event.timestamp).toLocaleString('ru-RU')}</td>
                <td><a href="/pc/${event.pc_id}">${event.pc_id}</a></td>
                <td>${componentNames[event.component_type] || event.component_type}</td>
                <td>${eventTypes[event.event_type] || event.event_type}</td>
                <td>${event.details || '-'}</td>
            `;
            tbody.appendChild(row);
        });
        
        updateSortIcons();
    });
}

function applyFilters() {
    currentFilters.component_type = document.getElementById('filter-component').value;
    currentFilters.event_type = document.getElementById('filter-event-type').value;
    currentFilters.building = document.getElementById('filter-building').value.trim();
    currentFilters.floor = document.getElementById('filter-floor').value.trim();
    currentFilters.location = document.getElementById('filter-location').value.trim();
    currentFilters.date_from = document.getElementById('filter-date-from').value;
    currentFilters.date_to = document.getElementById('filter-date-to').value;
    currentFilters.search = document.getElementById('filter-search').value.trim();
    currentFilters.skip = 0;
    currentPage = 1;
    loadEvents();
}

function resetFilters() {
    document.getElementById('filter-component').value = '';
    document.getElementById('filter-event-type').value = '';
    document.getElementById('filter-building').value = '';
    document.getElementById('filter-floor').value = '';
    document.getElementById('filter-location').value = '';
    document.getElementById('filter-date-from').value = '';
    document.getElementById('filter-date-to').value = '';
    document.getElementById('filter-search').value = '';
    currentFilters = {
        component_type: '',
        event_type: '',
        building: '',
        floor: '',
        location: '',
        date_from: '',
        date_to: '',
        search: '',
        sort_by: 'timestamp',
        sort_order: 'desc',
        skip: 0,
        limit: 50
    };
    currentPage = 1;
    loadEvents();
}

function sortTable(column) {
    if (currentFilters.sort_by === column) {
        currentFilters.sort_order = currentFilters.sort_order === 'asc' ? 'desc' : 'asc';
    } else {
        currentFilters.sort_by = column;
        currentFilters.sort_order = 'desc';
    }
    currentFilters.skip = 0;
    currentPage = 1;
    loadEvents();
}

function updateSortIcons() {
    // Сбрасываем все иконки
    document.querySelectorAll('[id^="sort-"]').forEach(icon => {
        icon.className = 'bi bi-arrow-down-up';
    });
    
    // Устанавливаем иконку для текущей сортировки
    const icon = document.getElementById(`sort-${currentFilters.sort_by}`);
    if (icon) {
        icon.className = currentFilters.sort_order === 'asc' 
            ? 'bi bi-arrow-up' 
            : 'bi bi-arrow-down';
    }
}

function updatePagination() {
    const pagination = document.getElementById('pagination');
    pagination.innerHTML = '';
    
    if (totalPages <= 1) return;
    
    // Предыдущая страница
    const prevLi = document.createElement('li');
    prevLi.className = `page-item ${currentPage === 1 ? 'disabled' : ''}`;
    prevLi.innerHTML = `<a class="page-link" href="#" onclick="goToPage(${currentPage - 1}); return false;">Предыдущая</a>`;
    pagination.appendChild(prevLi);
    
    // Номера страниц
    const startPage = Math.max(1, currentPage - 2);
    const endPage = Math.min(totalPages, currentPage + 2);
    
    if (startPage > 1) {
        const li = document.createElement('li');
        li.className = 'page-item';
        li.innerHTML = `<a class="page-link" href="#" onclick="goToPage(1); return false;">1</a>`;
        pagination.appendChild(li);
        if (startPage > 2) {
            const li = document.createElement('li');
            li.className = 'page-item disabled';
            li.innerHTML = `<span class="page-link">...</span>`;
            pagination.appendChild(li);
        }
    }
    
    for (let i = startPage; i <= endPage; i++) {
        const li = document.createElement('li');
        li.className = `page-item ${i === currentPage ? 'active' : ''}`;
        li.innerHTML = `<a class="page-link" href="#" onclick="goToPage(${i}); return false;">${i}</a>`;
        pagination.appendChild(li);
    }
    
    if (endPage < totalPages) {
        if (endPage < totalPages - 1) {
            const li = document.createElement('li');
            li.className = 'page-item disabled';
            li.innerHTML = `<span class="page-link">...</span>`;
            pagination.appendChild(li);
        }
        const li = document.createElement('li');
        li.className = 'page-item';
        li.innerHTML = `<a class="page-link" href="#" onclick="goToPage(${totalPages}); return false;">${totalPages}</a>`;
        pagination.appendChild(li);
    }
    
    // Следующая страница
    const nextLi = document.createElement('li');
    nextLi.className = `page-item ${currentPage === totalPages ? 'disabled' : ''}`;
    nextLi.innerHTML = `<a class="page-link" href="#" onclick="goToPage(${currentPage + 1}); return false;">Следующая</a>`;
    pagination.appendChild(nextLi);
}

function goToPage(page) {
    if (page < 1 || page > totalPages) return;
    currentPage = page;
    currentFilters.skip = (page - 1) * currentFilters.limit;
    loadEvents();
}

// Автоматическая фильтрация при изменении полей
document.getElementById('filter-component').addEventListener('change', applyFilters);
document.getElementById('filter-event-type').addEventListener('change', applyFilters);
document.getElementById('filter-building').addEventListener('input', debounce(applyFilters, 500));
document.getElementById('filter-floor').addEventListener('input', debounce(applyFilters, 500));
document.getElementById('filter-location').addEventListener('input', debounce(applyFilters, 500));
document.getElementById('filter-date-from').addEventListener('change', applyFilters);
document.getElementById('filter-date-to').addEventListener('change', applyFilters);
document.getElementById('filter-search').addEventListener('input', debounce(applyFilters, 500));

// Функция debounce для задержки вызова при вводе текста
function debounce(func, wait) {
    let timeout;
    return function executedFunction(...args) {
        const later = () => {
            clearTimeout(timeout);
            func(...args);
        };
        clearTimeout(timeout);
        timeout = setTimeout(later, wait);
    };
}

// Загрузка данных
loadEvents();
</script>
{% endblock %}
